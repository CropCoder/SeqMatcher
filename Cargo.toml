[package]
name = "seq_matcher"
version = "2.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
csv = "1.3"
rayon = "1.8"
anyhow = "1.0"
aho-corasick = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 1

[[bench]]
name = "ac_matching"
harness = false

[[bench]]
name = "reverse_complement"
harness = false